name: Build

on:
  push:
    branches: ["main", "prBuild"]
  pull_request:
    branches: ["main", "prBuild"]

  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4.1.7

      - uses: krdlab/setup-haxe@master
        with:
          haxe-version: 4.3.4

      - name: Install Haxelib
        run: |
          haxelib setup C:/haxelib
          haxelib install hxcpp --quiet
          haxelib install format --quiet --skip-dependencies
          haxelib install hxp --quiet --skip-dependencies
          haxelib git lime https://github.com/swordcubes-grave-of-shite/lime --quiet --skip-dependencies
          haxelib install openfl 9.3.3 --quiet --skip-dependencies
          haxelib install flixel 5.6.1 --quiet --skip-dependencies
  
      - name: Create Version Tag
        run: echo "${{github.run_id}}" > VERSION

      - name: Compile
        run: haxelib run lime build windows --app-version="0.0.1-${{ github.run_id}}" -release
  
      - name: Publish Artifact
        uses: actions/upload-artifact@v4.3.4
        with:
          name: windows
          path: export/windows/bin
